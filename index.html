<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubuntu Server 22.04.5 LTS — Install &amp; Configure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --aubergine-900:#1B0012;
  --aubergine-800:#2C001E;
  --aubergine-700:#3D0F2C;
  --aubergine-600:#5E2750;
  --aubergine-500:#77216F;
  --orange:#E95420;
  --orange-soft:#F09B7A;
  --warm-100:#F7F3F2;
  --warm-300:#D6CFCC;
  --warm-500:#A39A97;
  --ink:#0A0006;
  --term-bg:#12000C;
  --term-line:rgba(233,84,32,.16);
  --ok:#5FCF80;
  --rail-w:264px;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%}

body{
  background:
    radial-gradient(1100px 700px at 78% -8%, rgba(119,33,111,.55), transparent 62%),
    radial-gradient(800px 600px at 0% 100%, rgba(233,84,32,.10), transparent 60%),
    var(--aubergine-800);
  color:var(--warm-100);
  font-family:'Ubuntu',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ---------- shell ---------- */
.shell{display:flex;height:100vh;width:100%}

/* ---------- rail ---------- */
.rail{
  width:var(--rail-w);
  flex:0 0 var(--rail-w);
  border-right:1px solid rgba(247,243,242,.09);
  background:rgba(27,0,18,.5);
  display:flex;flex-direction:column;
  backdrop-filter:blur(6px);
}
.rail-head{padding:26px 22px 18px;border-bottom:1px solid rgba(247,243,242,.08)}
.mark{display:flex;align-items:center;gap:10px}
.dot-ring{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--orange);position:relative;flex:0 0 22px;
}
.dot-ring::after{
  content:"";position:absolute;inset:4px;border-radius:50%;background:var(--orange);
}
.mark-txt{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--warm-300);font-weight:500}
.rail-sub{margin-top:12px;font-size:11px;color:var(--warm-500);letter-spacing:.06em;font-family:'Ubuntu Mono',monospace}

.rail-list{flex:1;overflow-y:auto;padding:12px 0 24px;scrollbar-width:thin;scrollbar-color:var(--aubergine-600) transparent}
.rail-list::-webkit-scrollbar{width:6px}
.rail-list::-webkit-scrollbar-thumb{background:var(--aubergine-600);border-radius:3px}

.rail-item{
  display:flex;gap:12px;align-items:flex-start;
  padding:9px 22px;cursor:pointer;border:0;background:none;
  width:100%;text-align:left;color:var(--warm-500);
  font-family:inherit;font-size:13.5px;font-weight:300;line-height:1.35;
  transition:color .18s ease,background .18s ease;
  position:relative;
}
.rail-item:hover{color:var(--warm-100);background:rgba(247,243,242,.04)}
.rail-item .rn{
  font-family:'Ubuntu Mono',monospace;font-size:11px;
  color:var(--aubergine-500);flex:0 0 22px;padding-top:2px;
  transition:color .18s ease;
}
.rail-item.done .rn{color:var(--orange-soft)}
.rail-item.active{color:#fff;background:rgba(233,84,32,.10)}
.rail-item.active::before{
  content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--orange);
}
.rail-item.active .rn{color:var(--orange)}
.rail-item.phase{
  pointer-events:none;padding-top:20px;padding-bottom:6px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--aubergine-500);font-weight:500;
}

/* ---------- stage ---------- */
.stage{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}

.topbar{
  display:flex;justify-content:flex-end;align-items:center;gap:14px;
  padding:20px 34px 0;
}
.lang{
  display:inline-flex;border:1px solid rgba(247,243,242,.18);border-radius:999px;
  overflow:hidden;background:rgba(27,0,18,.55);
}
.lang button{
  border:0;background:none;cursor:pointer;
  font-family:'Ubuntu Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.1em;
  color:var(--warm-500);padding:7px 15px;transition:background .18s,color .18s;
}
.lang button.on{background:var(--orange);color:#fff}
.lang button:not(.on):hover{color:var(--warm-100)}

.slide-wrap{flex:1;overflow-y:auto;padding:22px 34px 30px;scrollbar-width:thin;scrollbar-color:var(--aubergine-600) transparent}
.slide-wrap::-webkit-scrollbar{width:8px}
.slide-wrap::-webkit-scrollbar-thumb{background:var(--aubergine-600);border-radius:4px}

.slide{max-width:920px;margin:0 auto;animation:rise .38s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}

.eyebrow{
  font-family:'Ubuntu Mono',monospace;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--orange);margin-bottom:14px;
}
h1{
  font-size:clamp(30px,4.4vw,52px);font-weight:700;line-height:1.04;
  letter-spacing:-.022em;margin-bottom:16px;
}
h1 .thin{font-weight:300;color:var(--warm-300);display:block}
.lede{font-size:17px;line-height:1.62;color:var(--warm-300);max-width:66ch;margin-bottom:26px;font-weight:300}
p.body{font-size:15.5px;line-height:1.68;color:var(--warm-300);max-width:70ch;margin-bottom:16px}
p.body strong{color:var(--warm-100);font-weight:500}
code.inl{
  font-family:'Ubuntu Mono',monospace;font-size:.93em;
  background:rgba(233,84,32,.13);color:var(--orange-soft);
  padding:1px 6px;border-radius:4px;
}

/* title slide */
.hero-badge{
  display:inline-flex;align-items:center;gap:9px;
  border:1px solid rgba(233,84,32,.4);border-radius:999px;
  padding:6px 14px;margin-bottom:26px;
  font-family:'Ubuntu Mono',monospace;font-size:11.5px;letter-spacing:.12em;color:var(--orange-soft);
}
.hero-meta{display:flex;flex-wrap:wrap;gap:36px;margin-top:34px;padding-top:26px;border-top:1px solid rgba(247,243,242,.12)}
.hero-meta div{min-width:120px}
.hero-meta dt{font-family:'Ubuntu Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--warm-500);margin-bottom:6px}
.hero-meta dd{font-size:16px;color:var(--warm-100);font-weight:500}

/* terminal */
.term{
  background:var(--term-bg);border:1px solid var(--term-line);border-radius:8px;
  margin:16px 0 20px;overflow:hidden;
}
.term-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 12px;border-bottom:1px solid var(--term-line);background:rgba(233,84,32,.05);
}
.term-tag{font-family:'Ubuntu Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--warm-500)}
.copy{
  border:1px solid rgba(247,243,242,.16);background:none;color:var(--warm-500);cursor:pointer;
  font-family:'Ubuntu Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  padding:3px 10px;border-radius:4px;transition:.18s;
}
.copy:hover{border-color:var(--orange);color:var(--orange)}
.copy.done{border-color:var(--ok);color:var(--ok)}
.term-body{padding:13px 15px;overflow-x:auto}
.term-body pre{
  font-family:'Ubuntu Mono',monospace;font-size:13.5px;line-height:1.72;
  color:#EDE4E1;white-space:pre;
}
.term-body .pr{color:var(--orange);user-select:none}
.term-body .cm{color:var(--warm-500)}

/* cards */
.card{border-radius:8px;padding:15px 18px;margin:16px 0;border-left:3px solid}
.card h4{font-size:13px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;margin-bottom:7px}
.card p{font-size:14.5px;line-height:1.62;color:var(--warm-300);font-weight:300}
.card.warn{background:rgba(233,84,32,.10);border-color:var(--orange)}
.card.warn h4{color:var(--orange)}
.card.tip{background:rgba(119,33,111,.24);border-color:var(--aubergine-500)}
.card.tip h4{color:#D9A7D3}
.card.ok{background:rgba(95,207,128,.09);border-color:var(--ok)}
.card.ok h4{color:var(--ok)}

/* settings table */
.tbl{width:100%;border-collapse:collapse;margin:14px 0 20px;font-size:14.5px}
.tbl tr{border-bottom:1px solid rgba(247,243,242,.09)}
.tbl td{padding:9px 4px;vertical-align:top}
.tbl td:first-child{color:var(--warm-500);width:38%;font-weight:300}
.tbl td:last-child{color:var(--warm-100);font-weight:400}
.tbl td:last-child b{color:var(--orange-soft);font-weight:700}

/* list */
ul.pts{list-style:none;margin:12px 0 20px}
ul.pts li{
  position:relative;padding-left:22px;margin-bottom:10px;
  font-size:15px;line-height:1.62;color:var(--warm-300);max-width:70ch;
}
ul.pts li::before{
  content:"▸";position:absolute;left:0;top:-1px;color:var(--orange);font-size:13px;
}
ul.pts li strong{color:var(--warm-100);font-weight:500}

.linkout{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'Ubuntu Mono',monospace;font-size:13px;
  color:var(--orange);text-decoration:none;border-bottom:1px solid rgba(233,84,32,.4);
  padding-bottom:2px;word-break:break-all;
}
.linkout:hover{color:var(--orange-soft);border-color:var(--orange-soft)}

/* nav */
.navbar{
  display:flex;align-items:center;gap:18px;
  padding:14px 34px 20px;border-top:1px solid rgba(247,243,242,.09);
  background:rgba(27,0,18,.4);
}
.nb{
  border:1px solid rgba(247,243,242,.2);background:none;color:var(--warm-300);
  cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:400;
  padding:8px 18px;border-radius:6px;transition:.18s;
}
.nb:hover:not(:disabled){border-color:var(--orange);color:var(--orange);background:rgba(233,84,32,.08)}
.nb:disabled{opacity:.3;cursor:not-allowed}
.nb.pri{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:500}
.nb.pri:hover:not(:disabled){background:#F46437;border-color:#F46437;color:#fff}
.track{flex:1;height:2px;background:rgba(247,243,242,.13);border-radius:2px;overflow:hidden}
.track span{display:block;height:100%;background:var(--orange);transition:width .34s cubic-bezier(.2,.7,.3,1)}
.count{font-family:'Ubuntu Mono',monospace;font-size:12px;color:var(--warm-500);letter-spacing:.08em;min-width:56px;text-align:right}

:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* responsive */
@media(max-width:900px){
  :root{--rail-w:0px}
  .rail{display:none}
  .slide-wrap{padding:16px 20px 24px}
  .topbar{padding:14px 20px 0}
  .navbar{padding:12px 20px 16px;gap:12px}
  .nb{padding:7px 13px;font-size:13px}
  .hero-meta{gap:22px}
}
</style>
</head>

</div>

      {en:"<strong>Network Adapter</strong> → confirm NAT, tick Connect at power on, <strong>untick</strong> Replicate physical network connection state",ru:"<strong>Network Adapter</strong> → убедитесь, что NAT, отметьте Connect at power on, <strong>снимите</strong> Replicate physical network connection state"},
      {en:"<strong>Remove</strong> Sound Card, Printer and USB Controller",ru:"<strong>Удалите</strong> Sound Card, Printer и USB Controller"},
      {en:"<strong>Display</strong> → untick Accelerate 3D graphics",ru:"<strong>Display</strong> → снимите Accelerate 3D graphics"}
    ]},
    {t:"tip",title:{en:"That one unticked box saves you a two-minute boot hang",ru:"Одна снятая галочка избавит от двухминутного зависания при загрузке"},
      en:"Replicate physical network connection state drops the guest's virtual link whenever the host adapter blips — which Wi-Fi does constantly. The guest then boots with no carrier, and systemd-networkd-wait-online blocks startup for two full minutes before giving up.",
      ru:"Replicate physical network connection state сбрасывает виртуальный линк гостя при каждом кратком сбое адаптера хоста — а Wi-Fi делает это постоянно. Гость загружается без несущей, и systemd-networkd-wait-online блокирует запуск на две минуты, прежде чем сдаться."},
    {t:"p",en:"Now power on the VM. Click inside the window to capture your keyboard; <strong>Ctrl+Alt</strong> releases it back to the host.",ru:"Теперь включите ВМ. Кликните внутри окна, чтобы захватить клавиатуру; <strong>Ctrl+Alt</strong> возвращает её хосту."}
  ]
},

/* 6 ── NETWORK ───────────────────────────────────────────── */
{
  phase:{en:"Installer",ru:"Установщик"},
  nav:{en:"Network — set static here",ru:"Сеть — статика здесь"},
  eyebrow:{en:"Step 06 · the important one",ru:"Шаг 06 · самый важный"},
  title:{en:"Set the static IP now, inside the installer",ru:"Задайте статический IP прямо в установщике"},
  blocks:[
    {t:"p",en:"You will see <code class='inl'>ens33</code> with a DHCP address already assigned. Highlight it → <strong>Enter</strong> → <strong>Edit IPv4</strong> → change method from Automatic (DHCP) to <strong>Manual</strong>.",ru:"Вы увидите <code class='inl'>ens33</code> с уже полученным адресом DHCP. Выделите его → <strong>Enter</strong> → <strong>Edit IPv4</strong> → смените метод с Automatic (DHCP) на <strong>Manual</strong>."},
    {t:"cmd",tag:{en:"Fill in — substitute your own subnet",ru:"Заполните — подставьте свою подсеть"},lines:[
      "Subnet:         192.168.81.0/24",
      "Address:        192.168.81.50",
      "Gateway:        192.168.81.2",
      "Name servers:   1.1.1.1,8.8.8.8",
      "Search domains: (leave blank)"
    ]},
    {t:"list",items:[
      {en:"<strong>Subnet</strong> is the network in CIDR form, ending in .0/24 — not your own address",ru:"<strong>Subnet</strong> — это сеть в формате CIDR, оканчивается на .0/24 — не ваш собственный адрес"},
      {en:"<strong>Gateway</strong> on a VMware NAT network is <code class='inl'>.2</code>, not <code class='inl'>.1</code>",ru:"<strong>Gateway</strong> в сети VMware NAT — это <code class='inl'>.2</code>, а не <code class='inl'>.1</code>"},
      {en:"<strong>Name servers</strong> are comma separated with no spaces",ru:"<strong>Name servers</strong> перечисляются через запятую без пробелов"}
    ]},
    {t:"ok",title:{en:"Why here and not later",ru:"Почему здесь, а не потом"},
      en:"When you set a static address in the installer, subiquity writes the netplan config and also disables cloud-init's network management for you. Configure it after installation instead and cloud-init stays in charge — it keeps writing its own DHCP config that merges with yours, leaving the interface with two addresses. Doing it here removes that entire class of problem.",
      ru:"Когда вы задаёте статический адрес в установщике, subiquity записывает конфигурацию netplan и заодно отключает управление сетью со стороны cloud-init. Если настроить сеть после установки, cloud-init останется главным — он продолжит писать свой DHCP-конфиг, который сольётся с вашим, и на интерфейсе окажется два адреса. Настройка здесь снимает весь этот класс проблем."},
    {t:"p",en:"Save, then confirm the interface line now reads <strong>static</strong> rather than DHCPv4 before you continue.",ru:"Сохраните и убедитесь, что в строке интерфейса теперь написано <strong>static</strong>, а не DHCPv4, прежде чем продолжать."}
  ]
},

/* 7 ── PROXY & MIRROR ────────────────────────────────────── */
{
  phase:{en:"Installer",ru:"Установщик"},
  nav:{en:"Proxy and mirror",ru:"Прокси и зеркало"},
  eyebrow:{en:"Step 07",ru:"Шаг 07"},
  title:{en:"Proxy and archive mirror",ru:"Прокси и зеркало архива"},
  blocks:[
    {t:"p",en:"<strong>Proxy:</strong> leave blank unless you are behind a corporate proxy.",ru:"<strong>Proxy:</strong> оставьте пустым, если вы не за корпоративным прокси."},
    {t:"p",en:"<strong>Mirror:</strong> accept the default. The installer tests it and shows scrolling output while it works.",ru:"<strong>Mirror:</strong> примите значение по умолчанию. Установщик проверяет зеркало и показывает бегущий вывод во время работы."},
    {t:"cmd",tag:{en:"Normal output",ru:"Нормальный вывод"},lines:[
      "Ign:1 http://archive.ubuntu.com/ubuntu jammy InRelease",
      "Get:2 http://archive.ubuntu.com/ubuntu jammy Release [265 kB]"
    ]},
    {t:"ok",title:{en:"Ign lines are fine",ru:"Строки Ign — это нормально"},
      en:"Ign simply means apt skipped a file it did not need. Only Err lines, or the message that the mirror does not seem to work, indicate a real problem.",
      ru:"Ign означает лишь, что apt пропустил ненужный ему файл. Только строки Err или сообщение о неработающем зеркале указывают на настоящую проблему."},
    {t:"warn",title:{en:"If the mirror test fails",ru:"Если проверка зеркала не проходит"},
      en:"That is a networking problem, not a mirror problem. Go back to the network screen and check the gateway and name servers. A wrong gateway produces exactly this symptom.",
      ru:"Это проблема сети, а не зеркала. Вернитесь на экран настройки сети и проверьте шлюз и DNS-серверы. Неверный шлюз даёт ровно такой симптом."}
  ]
},

/* 8 ── STORAGE ───────────────────────────────────────────── */
{
  phase:{en:"Installer",ru:"Установщик"},
  nav:{en:"Storage — the LVM trap",ru:"Диск — ловушка LVM"},
  eyebrow:{en:"Step 08 · second most important",ru:"Шаг 08 · второй по важности"},
  title:{en:"Storage, and the half-a-disk problem",ru:"Разметка и проблема половины диска"},
  blocks:[
    {t:"list",items:[
      {en:"Select <strong>Use an entire disk</strong>",ru:"Выберите <strong>Use an entire disk</strong>"},
      {en:"<strong>Untick</strong> “Set up this disk as an LVM group” — press Space",ru:"<strong>Снимите</strong> «Set up this disk as an LVM group» — нажмите Space"},
      {en:"Leave LUKS encryption off",ru:"Шифрование LUKS оставьте выключенным"}
    ]},
    {t:"warn",title:{en:"What happens if you leave LVM on",ru:"Что произойдёт, если оставить LVM"},
      en:"The installer creates a volume group spanning the whole disk but allocates only about half of it to the root logical volume. On a 60 GB disk you boot into roughly 26 GB of usable space while the rest sits unclaimed. Nothing warns you. You discover it later when a service fills the disk.",
      ru:"Установщик создаёт группу томов на весь диск, но выделяет корневому логическому тому лишь около половины. На диске 60 ГБ вы загрузитесь примерно в 26 ГБ доступного места, а остальное останется невостребованным. Никаких предупреждений не будет. Вы узнаете об этом позже, когда какой-нибудь сервис заполнит диск."},
    {t:"p",en:"On the storage summary screen, confirm the root filesystem shows close to the full disk size before continuing. Then confirm the destructive write warning.",ru:"На экране сводки разметки убедитесь, что корневая файловая система показывает объём, близкий к полному размеру диска. Затем подтвердите предупреждение о перезаписи."},
    {t:"tip",title:{en:"If you want to keep LVM anyway",ru:"Если вы всё же хотите LVM"},
      en:"It is genuinely useful for snapshots and later resizing. Just highlight ubuntu-lv on the summary screen, choose Edit, and set Size to the maximum before saving. Or fix it after boot — step 12 shows how.",
      ru:"Он действительно полезен для снимков и последующего изменения размера. Просто выделите ubuntu-lv на экране сводки, выберите Edit и задайте максимальный размер перед сохранением. Или исправьте после загрузки — шаг 12 показывает как."}
  ]
},

  blocks:[

/* 10 ── FINISH ───────────────────────────────────────────── */
{
  phase:{en:"Installer",ru:"Установщик"},
  nav:{en:"Finish and reboot",ru:"Завершение и перезагрузка"},
  eyebrow:{en:"Step 10",ru:"Шаг 10"},
  title:{en:"Let it finish, then reboot",ru:"Дождитесь конца и перезагрузитесь"},
  blocks:[
    {t:"p",en:"Installation takes five to twenty minutes. It will appear to stall on “Downloading and installing security updates” near the end — let it run. <strong>View full log</strong> shows what it is actually doing.",ru:"Установка занимает от пяти до двадцати минут. Ближе к концу она словно застрянет на «Downloading and installing security updates» — дайте ей доработать. <strong>View full log</strong> покажет, что происходит на самом деле."},
    {t:"p",en:"Choose <strong>Reboot Now</strong>. You will get a prompt asking you to remove the installation medium — in most cases you can simply press <strong>Enter</strong>. VMware releases the virtual disc itself and the machine boots straight into the installed system.",ru:"Выберите <strong>Reboot Now</strong>. Появится запрос об извлечении установочного носителя — в большинстве случаев достаточно нажать <strong>Enter</strong>. VMware сама освободит виртуальный диск, и машина загрузится в установленную систему."},
    {t:"ok",title:{en:"“Failed unmounting /cdrom” is cosmetic",ru:"«Failed unmounting /cdrom» — косметика"},
      en:"The installer wanted to unmount the ISO before shutting down and could not. Every Ubuntu install prints this. It does not affect the installed system.",
      ru:"Установщик хотел отмонтировать образ перед выключением и не смог. Это печатает каждая установка Ubuntu. На установленную систему это не влияет."},
    {t:"warn",title:{en:"Only if it boots back into the installer",ru:"Только если снова грузится установщик"},
      en:"If the GRUB menu offers you “Try or Install Ubuntu Server” again, the ISO is still attached and ahead of the disk in the boot order. Detach it, then reset the machine.",
      ru:"Если меню GRUB снова предлагает «Try or Install Ubuntu Server», образ всё ещё подключён и стоит в порядке загрузки выше диска. Отключите его и перезапустите машину."},
    {t:"cmd",tag:{en:"VMware menu — only if needed",ru:"Меню VMware — только при необходимости"},lines:[
      "VM → Removable Devices → CD/DVD → Disconnect",
      "VM → Settings → CD/DVD → untick Connect at power on",
      "VM → Power → Restart Guest"
    ]},
    {t:"tip",title:{en:"Why some installs never need this",ru:"Почему в части случаев это не нужно"},
      en:"Whether the disc still competes for the boot order depends on how the VM was created. When the ISO is attached through the wizard's Select ISO image option, VMware often releases it automatically once the install completes. When it is attached manually after choosing “install the OS later”, it stays exactly as configured — so this is the path where the GRUB menu occasionally reappears. Either way the fix above is harmless, so try Enter first and only fall back if you need to.",
      ru:"Будет ли диск конкурировать за порядок загрузки, зависит от того, как создавалась ВМ. Если образ подключён через опцию мастера Select ISO image, VMware часто освобождает его сама по завершении установки. Если же он подключён вручную после выбора «install the OS later», он остаётся ровно так, как настроен, — именно на этом пути иногда снова появляется меню GRUB. В любом случае описанное выше безвредно, поэтому сначала нажмите Enter и прибегайте к нему только при необходимости."}
  ]
},

/* 11 ── FIRST BOOT ───────────────────────────────────────── */
{
  phase:{en:"First boot",ru:"Первая загрузка"},
  nav:{en:"Verify the basics",ru:"Проверить основное"},
  eyebrow:{en:"Step 11",ru:"Шаг 11"},
  title:{en:"Log in and check four things",ru:"Войдите и проверьте четыре вещи"},
  blocks:[
    {t:"p",en:"The password will not echo any characters as you type. That is expected, not a broken keyboard.",ru:"Пароль не отображается при вводе никакими символами. Так и должно быть, клавиатура исправна."},
    {t:"cmd",tag:{en:"Verification",ru:"Проверка"},lines:[
      "ip -br a          # exactly one address on ens33",
      "ip r | grep default",
      "ping -c3 1.1.1.1        # raw connectivity",
      "ping -c3 archive.ubuntu.com   # DNS resolution",
      "df -h /           # close to the full disk size?"
    ]},
    {t:"list",items:[
      {en:"<strong>One address only.</strong> Two means cloud-init is still running DHCP alongside your static — see step 13",ru:"<strong>Только один адрес.</strong> Два означают, что cloud-init всё ещё держит DHCP рядом с вашей статикой — см. шаг 13"},
      {en:"<strong>First ping works, second fails</strong> → your name servers are wrong",ru:"<strong>Первый ping проходит, второй нет</strong> → неверные DNS-серверы"},
      {en:"<strong>Both pings fail</strong> → gateway is wrong, or the adapter is not connected",ru:"<strong>Оба ping не проходят</strong> → неверный шлюз или адаптер не подключён"},
      {en:"<strong>Disk is about half the size you gave it</strong> → LVM, go to step 12",ru:"<strong>Диск примерно вдвое меньше заданного</strong> → это LVM, перейдите к шагу 12"}
    ]},
    {t:"tip",title:{en:"Fix the timezone while you are here",ru:"Заодно поправьте часовой пояс"},
      en:"Clock skew between a server and the machines reporting to it makes correlating events genuinely confusing later.",
      ru:"Расхождение часов между сервером и машинами, которые ему отчитываются, потом сильно затрудняет сопоставление событий."},
    {t:"cmd",tag:{en:"Timezone",ru:"Часовой пояс"},lines:["timedatectl","sudo timedatectl list-timezones | grep -i <city>","sudo timedatectl set-timezone Region/City"]}
  ]
},

/* 12 ── LVM FIX ──────────────────────────────────────────── */
{
  phase:{en:"First boot",ru:"Первая загрузка"},
  nav:{en:"Reclaim disk space",ru:"Вернуть место на диске"},
  eyebrow:{en:"Step 12 · only if you kept LVM",ru:"Шаг 12 · только если оставили LVM"},
  title:{en:"Reclaim the missing half of the disk",ru:"Верните недостающую половину диска"},
  blocks:[
    {t:"p",en:"If <code class='inl'>df -h /</code> showed roughly half the disk you allocated, the space is not lost — it is unallocated inside the volume group. No reinstall needed.",ru:"Если <code class='inl'>df -h /</code> показал примерно половину выделенного диска, место не потеряно — оно просто не распределено внутри группы томов. Переустановка не нужна."},
    {t:"cmd",tag:{en:"Check, then extend",ru:"Проверить, затем расширить"},lines:[
      "sudo vgs          # look at VFree — the unclaimed space",
      "sudo lvextend -l +100%FREE /dev/ubuntu-vg/ubuntu-lv",
      "sudo resize2fs /dev/ubuntu-vg/ubuntu-lv",
      "df -h /"
    ]},
    {t:"p",en:"Two commands because LVM and the filesystem are separate layers: <strong>lvextend</strong> grows the block device, <strong>resize2fs</strong> grows ext4 into the new space. Both run online — no unmount, no reboot.",ru:"Две команды, потому что LVM и файловая система — разные уровни: <strong>lvextend</strong> увеличивает блочное устройство, <strong>resize2fs</strong> расширяет ext4 на новое место. Обе работают на живой системе — без размонтирования и перезагрузки."},
    {t:"tip",title:{en:"If you expand the virtual disk later",ru:"Если позже увеличите виртуальный диск"},
      en:"Growing the disk in VMware requires the VM powered off with no snapshots. After booting you need an extra first step — growpart to extend the partition — before lvextend can see the new space.",
      ru:"Увеличение диска в VMware требует выключенной ВМ без снимков. После загрузки нужен дополнительный первый шаг — growpart для расширения раздела — прежде чем lvextend увидит новое место."},
    {t:"cmd",tag:{en:"After expanding the virtual disk",ru:"После увеличения виртуального диска"},lines:[
      "sudo growpart /dev/sda 3",
      "sudo pvresize /dev/sda3",
      "sudo lvextend -l +100%FREE /dev/ubuntu-vg/ubuntu-lv",
      "sudo resize2fs /dev/ubuntu-vg/ubuntu-lv"
    ]}
  ]
},

/* 13 ── CLOUD-INIT ───────────────────────────────────────── */
{
  phase:{en:"First boot",ru:"Первая загрузка"},
  nav:{en:"Duplicate IP check",ru:"Проверка двойного IP"},
  eyebrow:{en:"Step 13 · verification",ru:"Шаг 13 · проверка"},
  title:{en:"Make sure you have one address, not two",ru:"Убедитесь, что адрес один, а не два"},
  blocks:[
    {t:"p",en:"If you set the static address in the installer as instructed, this is already correct and you can skip ahead. Check anyway — it takes three seconds and the failure mode is subtle.",ru:"Если вы задали статический адрес в установщике, как описано, здесь уже всё правильно и можно идти дальше. Всё равно проверьте — это три секунды, а проявляется проблема неочевидно."},
    {t:"cmd",tag:{en:"Check",ru:"Проверка"},lines:["ip -br a","ls -l /etc/netplan/"]},
    {t:"p",en:"You want <strong>one address</strong> on ens33 and <strong>one file</strong> in the netplan directory. If you see a second address marked <code class='inl'>dynamic</code>, or a file named <code class='inl'>50-cloud-init.yaml</code>, apply the fix below.",ru:"Нужен <strong>один адрес</strong> на ens33 и <strong>один файл</strong> в каталоге netplan. Если видите второй адрес с пометкой <code class='inl'>dynamic</code> или файл <code class='inl'>50-cloud-init.yaml</code>, примените исправление ниже."},

/* ============================================================
   UI STRINGS
   ============================================================ */
const UI = {
  en:{back:"Back",next:"Next",copy:"Copy",copied:"Copied",railTitle:"Ubuntu Server",open:"Open"},
  ru:{back:"Назад",next:"Далее",copy:"Копир.",copied:"Готово",railTitle:"Ubuntu Server",open:"Открыть"}
};

/* ============================================================
   ENGINE
   ============================================================ */
let lang = "en";
let idx = 0;

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function hiCmd(line){
  let s = esc(line);
  const hash = s.indexOf("#");
  if(hash > -1){
    s = s.slice(0,hash) + '<span class="cm">' + s.slice(hash) + '</span>';
  }
  return s;
}

function renderBlocks(blocks){
  let h = "";
  blocks.forEach((b,i) => {
    if(b.t === "p"){
      h += '<p class="body">' + b[lang] + '</p>';
    }
    else if(b.t === "cmd"){
      const tag = b.tag ? b.tag[lang] : "shell";
      const body = b.lines.map(l => l === "" ? "" : hiCmd(l)).join("\n");
      h += '<div class="term">'
         +   '<div class="term-bar"><span class="term-tag">' + esc(tag) + '</span>'
         +     '<button class="copy" data-i="' + i + '" onclick="doCopy(this,' + i + ')">' + UI[lang].copy + '</button>'
         +   '</div>'
         +   '<div class="term-body"><pre>' + body + '</pre></div>'
         + '</div>';
    }
    else if(b.t === "warn" || b.t === "tip" || b.t === "ok"){
      h += '<div class="card ' + b.t + '"><h4>' + esc(b.title[lang]) + '</h4><p>' + b[lang] + '</p></div>';
    }
    else if(b.t === "list"){
      h += '<ul class="pts">' + b.items.map(it => '<li>' + it[lang] + '</li>').join("") + '</ul>';
    }
    else if(b.t === "tbl"){
      h += '<table class="tbl">' + b.rows.map(r =>
            '<tr><td>' + r.k[lang] + '</td><td>' + r.v[lang] + '</td></tr>').join("") + '</table>';
    }
    else if(b.t === "link"){
      h += '<p class="body"><a class="linkout" href="' + b.url + '" target="_blank" rel="noopener">↓ ' + esc(b.label) + '</a></p>';
    }
  });
  return h;
}

function render(){
  const s = DECK[idx];
  let h = "";

  if(s.hero){
    h += '<div class="hero-badge">● ' + esc(s.eyebrow[lang]) + '</div>';
    h += '<h1>' + esc(s.title[lang]) + '<span class="thin">' + esc(s.sub[lang]) + '</span></h1>';
    h += '<p class="lede">' + esc(s.lede[lang]) + '</p>';
    h += '<dl class="hero-meta">' + s.meta.map(m =>
          '<div><dt>' + esc(m.k[lang]) + '</dt><dd>' + esc(m.v[lang]) + '</dd></div>').join("") + '</dl>';
  } else {
    h += '<div class="eyebrow">' + esc(s.eyebrow[lang]) + '</div>';
    h += '<h1>' + esc(s.title[lang]) + '</h1>';
    h += renderBlocks(s.blocks);
  }

  const w = document.getElementById("wrap");
  w.innerHTML = '<div class="slide">' + h + '</div>';
  w.scrollTop = 0;

  document.getElementById("count").textContent =
    String(idx+1).padStart(2,"0") + " / " + String(DECK.length).padStart(2,"0");
  document.getElementById("bar").style.width = ((idx+1)/DECK.length*100) + "%";
  document.getElementById("prev").disabled = idx === 0;
  document.getElementById("next").disabled = idx === DECK.length-1;

  buildRail();
}

function buildRail(){
  const list = document.getElementById("railList");
  let h = "", lastPhase = null;
  DECK.forEach((s,i) => {
    const ph = s.phase[lang];
    if(ph !== lastPhase){
      h += '<div class="rail-item phase">' + esc(ph) + '</div>';
      lastPhase = ph;
    }
    const cls = i === idx ? "active" : (i < idx ? "done" : "");
    h += '<button class="rail-item ' + cls + '" onclick="jump(' + i + ')">'
       +   '<span class="rn">' + String(i).padStart(2,"0") + '</span>'
       +   '<span>' + esc(s.nav[lang]) + '</span>'
       + '</button>';
  });
  list.innerHTML = h;
  const act = list.querySelector(".rail-item.active");
  if(act) act.scrollIntoView({block:"nearest"});
}

function doCopy(btn, i){
  const s = DECK[idx];
  const blk = s.blocks[i];
  if(!blk || blk.t !== "cmd") return;
  const text = blk.lines.filter(l => !l.trim().startsWith("#")).join("\n");
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = UI[lang].copied;
    btn.classList.add("done");
    setTimeout(() => { btn.textContent = UI[lang].copy; btn.classList.remove("done"); }, 1400);
  }).catch(() => {
    btn.textContent = "—";
    setTimeout(() => { btn.textContent = UI[lang].copy; }, 1400);
  });
}

function go(d){
  const n = idx + d;
  if(n < 0 || n >= DECK.length) return;
  idx = n; render();
}

function jump(i){ idx = i; render(); }

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.getElementById("btnEn").classList.toggle("on", l === "en");
  document.getElementById("btnRu").classList.toggle("on", l === "ru");
  document.getElementById("lPrev").textContent = UI[l].back;
  document.getElementById("lNext").textContent = UI[l].next;
  document.getElementById("railTitle").textContent = UI[l].railTitle;
  render();
}

document.addEventListener("keydown", e => {
  if(e.target.tagName === "BUTTON" && e.key === " ") return;
  if(e.key === "ArrowRight" || e.key === "PageDown"){ e.preventDefault(); go(1); }
  if(e.key === "ArrowLeft"  || e.key === "PageUp"){ e.preventDefault(); go(-1); }
  if(e.key === "Home"){ e.preventDefault(); jump(0); }
  if(e.key === "End"){ e.preventDefault(); jump(DECK.length-1); }
});

render();
</script>
